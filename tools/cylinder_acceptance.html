<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>圆柱截面求解器验收页</title>
<style>body{font:16px sans-serif;margin:24px;color:#18324a}main{max-width:1000px;margin:auto}canvas{display:block;width:100%;height:480px;border:1px solid #d7e3ef;border-radius:12px}label{display:flex;gap:12px;align-items:center;margin:16px 0}input{flex:1}#out{font-variant-numeric:tabular-nums}</style>
<main><h1>圆柱截面求解器验收</h1><label>截面偏移 <input id="offset" type="range" min="-1.4" max="1.4" step="0.05" value="0"><span id="out"></span></label><canvas id="stage" data-visual-type="geometry"></canvas></main>
<script src="../frame/math.js"></script><script>
const cv=document.getElementById('stage'), slider=document.getElementById('offset'), out=document.getElementById('out');
function render(){const cut=MATH.solveCylinderCut({radius:1,height:2,n:[1,0,1],offset:Number(slider.value)});window.__MATH_CYLINDER_RESULT__=cut;MATH.cylinderSection(cv,{},cut);out.textContent=cut.shape+' · 面积 '+cut.area.toFixed(4);}
slider.addEventListener('input',render);render();
</script></html>
